<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products Client</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 760px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #222;
        }

        h1, h2 {
            margin-bottom: .4rem;
        }

        section {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        input {
            padding: .4rem;
            margin: .2rem .2rem .2rem 0;
        }

        button {
            padding: .4rem .8rem;
            cursor: pointer;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border-bottom: 1px solid #ddd;
            padding: .4rem;
            text-align: left;
        }

        #authMessage, #productMessage {
            min-height: 1.2rem;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }

        .ok {
            color: #1a7f37;
        }

        .err {
            color: #c0392b;
        }
    </style>
</head>
<body>
    <h1>Products Client</h1>

    <section id="userBar" class="hidden">
        Logged in as <strong id="currentUser"></strong>
        <button onclick="logout()">Logout</button>
    </section>

    <div id="authForms">
        <section>
            <h2>Register</h2>
            <input id="regUsername" placeholder="Username">
            <input id="regPassword" type="password" placeholder="Password">
            <button onclick="register()">Register</button>
        </section>

        <section>
            <h2>Login</h2>
            <input id="loginUsername" placeholder="Username">
            <input id="loginPassword" type="password" placeholder="Password">
            <button onclick="login()">Login</button>
        </section>
    </div>
    <p id="authMessage"></p>

    <section>
        <h2>Products</h2>

        <div id="addForm">
            <input id="prodName" placeholder="Name">
            <input id="prodPrice" type="number" step="0.01" placeholder="Price">
            <button onclick="addProduct()">Add</button>
        </div>
        <p id="productMessage"></p>

        <table>
            <thead>
                <tr><th>ID</th><th>Name</th><th>Price</th><th></th></tr>
            </thead>
            <tbody id="productRows"></tbody>
        </table>
    </section>

    <script>
        const API = "https://localhost:7125";

    function showAuth(text, ok = true) {
      const el = document.getElementById("authMessage");
      el.textContent = text;
      el.className = ok ? "ok" : "err";
    }

    function showProduct(text, ok = true) {
      const el = document.getElementById("productMessage");
      el.textContent = text;
      el.className = ok ? "ok" : "err";
    }

    async function authFetch(url, options = {}) {
      const token = localStorage.getItem("token");
      const headers = { ...(options.headers || {}) };
      if (token) headers["Authorization"] = `Bearer ${token}`;
      return fetch(url, { ...options, headers });
    }

    async function register() {
      const username = document.getElementById("regUsername").value.trim();
      const password = document.getElementById("regPassword").value;

      try {
        const res = await fetch(`${API}/api/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        showAuth(res.ok ? "Registered! You can log in now." : "Registration failed.", res.ok);
      } catch (e) {
        showAuth("Could not reach the API. Check the port and CORS.", false);
      }
    }

    async function login() {
      const username = document.getElementById("loginUsername").value.trim();
      const password = document.getElementById("loginPassword").value;

      try {
        const res = await fetch(`${API}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (!res.ok) {
          showAuth("Login failed. Check your username and password.", false);
          return;
        }

        const data = await res.json();
        localStorage.setItem("token", data.token); 
        localStorage.setItem("username", username); 
        showAuth("Logged in!");
        updateUI();
        loadProducts();
      } catch (e) {
        showAuth("Could not reach the API. Check the port and CORS.", false);
      }
    }

    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      showAuth("Logged out.");
      updateUI();
      loadProducts();
    }

    function updateUI() {
      const token = localStorage.getItem("token");
      const username = localStorage.getItem("username");
      const loggedIn = !!token;

      document.getElementById("userBar").classList.toggle("hidden", !loggedIn);
      document.getElementById("authForms").classList.toggle("hidden", loggedIn);
      document.getElementById("currentUser").textContent = username || "";
    }

    async function loadProducts() {
      const tbody = document.getElementById("productRows");
      tbody.innerHTML = "";

      try {
        const res = await fetch(`${API}/api/products`);
        if (!res.ok) { showProduct("Could not load products.", false); return; }

        const products = await res.json();
        for (const p of products) {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${p.id}</td>
            <td></td>
            <td>${p.price}</td>
            <td><button onclick="deleteProduct(${p.id})">Delete</button></td>`;
          tr.children[1].textContent = p.name; 
          tbody.appendChild(tr);
        }
      } catch (e) {
        showProduct("Could not reach the API. Check the port and CORS.", false);
      }
    }

    async function addProduct() {
      const name = document.getElementById("prodName").value.trim();
      const price = parseFloat(document.getElementById("prodPrice").value);

      const res = await authFetch(`${API}/api/products`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, price })
      });

      if (handleAuthErrors(res)) return;
      if (!res.ok) { showProduct("Could not add the product.", false); return; }

      showProduct("Product added.");
      document.getElementById("prodName").value = "";
      document.getElementById("prodPrice").value = "";
      loadProducts();
    }

    async function deleteProduct(id) {
      const res = await authFetch(`${API}/api/products/${id}`, { method: "DELETE" });

      if (handleAuthErrors(res)) return;
      if (!res.ok) { showProduct("Could not delete the product.", false); return; }

      showProduct("Product deleted.");
      loadProducts();
    }

    function handleAuthErrors(res) {
      if (res.status === 401) {
        showProduct("Please log in first.", false);
        return true;
      }
      if (res.status === 403) {
        showProduct("Only admins can do that.", false);
        return true;
      }
      return false;
    }

    updateUI();
    loadProducts();</script>
</body>
</html>
